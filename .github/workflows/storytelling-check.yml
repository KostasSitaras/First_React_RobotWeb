name: Storytelling branch build check

on:
  push:
    branches:
      - storytelling-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code and behavior
        run: |
          npm run lint
          npm test

      - name: Build portfolio
        run: npm run build
